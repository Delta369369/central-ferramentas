name: Limpar BO - MuPDF WASM
on:
  push:
    paths:
      - "ferramentas/limpar-bo/**"
      - ".github/workflows/limpar-bo-wasm.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar motor MuPDF WebAssembly
        run: npm install --no-save mupdf@1.28.6
      - name: Verificar fluxos e identificadores variáveis
        run: node ferramentas/limpar-bo/test-wasm.mjs
      - name: Conferir arquivos WASM disponíveis para navegador
        run: |
          set -e
          for file in mupdf.js mupdf-wasm.js mupdf-wasm.wasm; do
            curl -fsSIL --retry 2 "https://cdn.jsdelivr.net/npm/mupdf@1.28.6/dist/$file" >/dev/null
            echo "OK: $file"
          done
